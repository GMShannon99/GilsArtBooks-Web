<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gil Shannon Art Books</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <a class="back-link" href="index.html">&larr; All Volumes</a>
      <span id="title">&nbsp;</span>
      <span id="page-indicator">&nbsp;</span>
    </header>

    <main id="stage">
      <div id="book"></div>
      <button id="prev-btn" class="nav-btn" aria-label="Previous page">&#8249;</button>
      <button id="next-btn" class="nav-btn" aria-label="Next page">&#8250;</button>
    </main>

    <div id="loading">
      <div class="spinner"></div>
      <div>Loading book&hellip;</div>
    </div>

    <div id="video-overlay" class="hidden">
      <video id="hotspot-video" playsinline loop></video>
      <button id="video-close-btn" aria-label="Close video">&times;</button>
    </div>

    <footer id="hint">Click / drag a page corner &middot; Use &larr; &rarr; keys</footer>
  </div>

  <div id="zoom-overlay" class="zoom-overlay" aria-hidden="true">
    <div id="zoom-frame" class="zoom-frame"></div>
    <button id="print-btn" class="print-btn" aria-label="Print artwork" title="Print artwork">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"></polyline>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
    </button>
    <div id="print-status" class="print-status" aria-live="polite"></div>
  </div>

  <img id="print-frame" class="print-frame" alt="">

  <script src="vendor/page-flip.browser.js"></script>
  <script src="volumes.js"></script>
  <script src="script.js"></script>
</body>
</html>
